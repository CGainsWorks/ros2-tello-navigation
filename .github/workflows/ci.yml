name: CI

# Written for a free GitHub account, which means minutes are worth saving.
#
# The shape is: everything that guards correctness runs on every push and takes
# about four minutes; everything that re-derives a committed result runs weekly
# and on request, because it takes twenty and it cannot regress without one of
# the fast checks also failing.
#
# The specific economies, in order of how much they save:
#
#   * `concurrency` with `cancel-in-progress`. Pushing three times in five
#     minutes costs one run, not three. This is the single biggest saver and it
#     costs nothing.
#   * Three jobs on every push rather than one. That is the one deliberately
#     *un*-economical choice: the two Python jobs pay for a pip install each
#     and merging them would save forty seconds of billed time. They are
#     separate because Actions minutes are free on a public repository and
#     feedback latency is not: a lint error should not wait behind a two-minute
#     simulated flight. The third builds the ROS 2 workspace in a cached
#     container and flies the graph against the emulator; it is the slowest and
#     runs in parallel with the other two. On a private repository the
#     arithmetic reverses and the Python jobs should be merged.
#   * One Python version. A matrix over three versions triples the bill to catch
#     a class of problem this repository does not have: the code is plain Python
#     with numpy and OpenCV and the test suite pins the behaviour that matters.
#     docs/LIMITATIONS.md says so explicitly rather than leaving it implied.
#   * A short flight on push, the full one on a schedule. The simulated flight
#     renders and detects a few hundred frames, which is the expensive part of
#     this repository. A twenty-second flight proves the stack still flies; a
#     two-minute one produces the numbers in docs/RESULTS.md and those are
#     already committed.
#   * `paths-ignore` for documentation-only pushes. Editing a Markdown file
#     cannot break the test suite.
#   * `timeout-minutes` everywhere. A hung job on GitHub's default runs for six
#     hours before anyone notices.
#
# NOTE ON REPOSITORY VISIBILITY. Actions on a private repository under a free
# account fails in seconds with no runner assigned and no useful message. If
# every job here dies instantly, check whether the repository is private before
# debugging the workflow.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:
  schedule:
    # Weekly, Monday 04:23 UTC. The full reproduction, not the guards.
    - cron: "23 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONPATH: src/tello_core

jobs:
  # The job that must stay green. Lint, the unit tests, the marker map and every
  # mission file, in one runner because they share a pip install and spinning up
  # a second runner costs more than running them in sequence.
  checks:
    name: Lint, tests and validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # From requirements.txt rather than an inline list, so this job and the
        # README's quick start cannot install different things.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ruff
        # No flags: the configuration lives in ruff.toml, so this and `make lint`
        # cannot drift apart.
        run: ruff check src tests scripts analysis

      - name: Unit tests
        # Everything except the end-to-end flights, which are marked slow and run
        # in the `flight` job. About forty seconds.
        run: python -m pytest -m "not slow" -q

      - name: Marker map validates and covers the room
        # Fails if any part of the flyable area cannot see a marker. That is a
        # property of the map rather than of the code, so it is checked on every
        # push: a map edit that opens a hole in the coverage is exactly the kind
        # of change that looks harmless in review.
        run: python scripts/validate_map.py

      - name: Every mission is flyable
        run: python scripts/validate_missions.py

      - name: ROS 2 packaging is coherent
        # Parses package.xml, setup.py and the message definitions without a ROS
        # installation. Catches a console script pointing at a function that does
        # not exist, which otherwise surfaces after a two-minute colcon build on
        # someone else's machine.
        run: python -m pytest tests/test_ros_packages.py -q

  # One short autonomous flight, end to end, through the documented entry point.
  # Twenty seconds of simulated flight, a couple of minutes of runner time.
  #
  # Using `scripts/run_mission.py` rather than a bespoke sequence is what stops
  # CI drifting away from the instructions in the README.
  flight:
    name: Smoke flight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fly missions/hop.yaml
        run: |
          python scripts/run_mission.py \
            --mission missions/hop.yaml \
            --out results/ci --stem smoke \
            --max-flight-time 40

      - name: The flight did what it was supposed to
        # The assertions are in a script rather than inline, so the same check
        # can be run locally when it fails here. Both waypoints are required: a
        # flight that takes off and lands without reaching anything is still a
        # flight that ends in LANDED and without this it would look green.
        run: |
          python scripts/check_flight.py --results results/ci --stem smoke \
            --expect-waypoints 2

      - name: Link loss lands the aircraft
        # The headline failsafe claim, checked on every push. It is cheap because
        # the outage starts five seconds in and the flight is over shortly after.
        # `link-loss-early` rather than `link-loss` because the latter drops the
        # link at eighteen seconds, which is after this mission has landed.
        run: |
          python scripts/run_mission.py \
            --mission missions/hop.yaml \
            --out results/ci --stem link_loss \
            --fault link-loss-early --max-flight-time 60 --quiet
          python scripts/check_flight.py --results results/ci --stem link_loss \
            --expect-cause LINK_LOSS --expect-silent

      - name: Upload the flight logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-flight-logs
          path: results/ci/
          retention-days: 7
          if-no-files-found: warn

  # The ROS 2 graph, built with colcon and flown end to end against the Tello
  # emulator by launch_testing: a waypoint mission, a link loss and a low
  # battery, each asserted against the emulator's (simulated) ground truth.
  #
  # In a container rather than with ROS installed on the runner, so that
  # `docker build -f docker/ros2/Dockerfile .` reproduces this job exactly on a
  # laptop. The image layers are cached in the Actions cache, so a push that
  # changes only Python rebuilds only the colcon layer. Results leave the
  # container by `docker cp`, not a bind mount: a writable bind mount is owned
  # by the runner's user and the container's root cannot always write to it.
  ros2:
    name: ROS 2 graph against the emulator
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the Humble workspace image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ros2/Dockerfile
          tags: tello-ros2:ci
          load: true
          cache-from: type=gha,scope=ros2
          cache-to: type=gha,scope=ros2,mode=max

      - name: Launch tests
        run: docker run --name tello-ros2 tello-ros2:ci

      - name: Copy the results out of the container
        if: always()
        run: |
          mkdir -p results
          docker cp tello-ros2:/ws/results/ros2 results/ros2 || true
          docker rm -f tello-ros2 || true

      - name: Upload the launch-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros2-launch-tests
          path: results/ros2/
          retention-days: 14
          if-no-files-found: warn

  # Everything that re-derives a committed result. Weekly and on request.
  #
  # Not on every push, deliberately. These jobs reproduce numbers that are
  # already in the repository and cannot change unless something the fast checks
  # also cover has changed. Paying twenty minutes per commit to re-derive them
  # buys nothing and a job slow enough to be ignored is worse than no job.
  reproduce:
    name: Reproduce the committed results
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: End-to-end flight tests
        run: python -m pytest -m slow -q

      - name: The reference mission
        run: python scripts/run_mission.py --mission missions/perimeter.yaml --out results/latest

      - name: Every failsafe case
        run: bash scripts/run_failsafe_cases.sh

      - name: Committed results are still reproducible
        # Compares headline metrics against the committed ones within a stated
        # tolerance rather than diffing the CSVs byte for byte. Byte-identical
        # reproduction across OpenCV and numpy versions is not achievable and
        # pretending otherwise produces a check that fails on every run and is
        # therefore ignored; scripts/check_reproducible.py explains exactly what
        # it compares and what it does not.
        run: python scripts/check_reproducible.py

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduction
          path: |
            results/
            analysis/figures/
          retention-days: 14
          if-no-files-found: warn

  # The container, which is what the README offers as the zero-install path. It
  # has to build and the demo has to run inside it.
  #
  # On request and on the schedule only: a Docker build is two minutes of runner
  # time and the Dockerfile changes far less often than the code in it.
  docker:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t tello-navigation:ci .

      - name: Fly the smoke mission inside it
        run: |
          docker run --rm tello-navigation:ci \
            python scripts/run_mission.py --mission missions/hop.yaml \
              --out results/ci --stem smoke --max-flight-time 40
