[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra shows a summary of everything that was not a plain pass, including skips.
# The hardware-in-the-loop tests skip unless TELLO_HARDWARE=1 is set, and a
# silent skip there would be indistinguishable from a pass.
addopts = -ra --strict-markers --durations=10

markers =
    hardware: requires a real DJI Tello on the network. Skipped unless TELLO_HARDWARE=1.
    slow: takes more than about ten seconds.

filterwarnings =
    error::DeprecationWarning:tello_core.*
    ignore::DeprecationWarning
